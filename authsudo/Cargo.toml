[package]
name = "authsudo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "authsudo"
path = "src/main.rs"

[dependencies]
authd-policy = { path = "../policy" }
authd-protocol = { path = "../protocol" }
peercred-ipc.workspace = true
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
